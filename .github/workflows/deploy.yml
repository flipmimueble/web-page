name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Separate from `build` so `contents: write` never reaches the actual
  # `next build` toolchain (Turbopack, and whatever build-time deps this
  # project grows) — only the narrow image-optimize-and-commit step needs
  # it. Note this job's own `yarn install` (needed to get `sharp`) still
  # runs under that write token; there's no way to avoid that without
  # dropping sharp from this repo's dependency tree entirely. `sharp` is
  # a well-audited, high-traffic package, so this is an accepted tradeoff,
  # not an oversight.
  prepare-uploads:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      # Deleting a Pieza in the Decap CMS admin only removes its
      # content/piezas/<slug>.md — it never touches the photo(s) that
      # entry referenced, so those would otherwise pile up under
      # public/uploads/piezas forever. Run before the image-optimize step
      # so we never spend time compressing a file we're about to delete.
      - name: Prune orphaned uploads
        if: github.actor != 'github-actions[bot]'
        run: node scripts/prune-orphaned-uploads.mjs

      # Mica uploads photos through the Decap CMS admin panel (public/admin),
      # which can be several MB straight off a phone. Resize/compress anything
      # under public/uploads/ before building, and commit the result back so
      # the repo (and the 1GB GitHub Pages cap) stay in check over time.
      # Skipped when this run's own commit already did it, to avoid a
      # pointless second commit when the resulting push re-triggers this
      # workflow.
      - name: Optimize uploaded images
        if: github.actor != 'github-actions[bot]'
        run: node scripts/optimize-uploads.mjs

      - name: Commit upload changes
        if: github.actor != 'github-actions[bot]'
        run: |
          if [ -n "$(git status --porcelain public/uploads)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add public/uploads
            git commit -m "chore: prune orphaned uploads and optimize images [skip ci]"
            git push
          else
            echo "No image changes to commit."
          fi

  build:
    needs: prepare-uploads
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build
        run: yarn build

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
