# Decap CMS config for Flipping de muebles.
#
# Backend generated by DecapBridge (decapbridge.com) after registering this
# repo there — real editors log in with email+password via DecapBridge's
# PKCE flow, no GitHub account needed. Regenerate from their dashboard if
# the site is ever re-registered.
backend:
  name: git-gateway
  repo: flipmimueble/web-page
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/b2717fd8-bdd8-4d0d-a137-a85d33651f1f/pkce
  auth_token_endpoint: /sites/b2717fd8-bdd8-4d0d-a137-a85d33651f1f/token
  gateway_url: https://gateway.decapbridge.com
  commit_messages:
    create: Create {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

logo_url: https://decapbridge.com/decapcms-with-bridge.svg
site_url: https://flipmimueble.com

# Spanish admin UI — Mica isn't a technical English speaker.
locale: "es"

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: "piezas"
    label: "Piezas"
    label_singular: "Pieza"
    folder: "content/piezas"
    create: true
    identifier_field: titulo
    slug: "{{slug}}"
    fields:
      - { label: "Título", name: "titulo", widget: "string" }
      - { label: "Resumen", name: "resumen", widget: "text" }
      - {
          label: "Foto antes",
          name: "fotoAntes",
          widget: "image",
          required: false,
          media_folder: "/public/uploads/piezas",
          public_folder: "/uploads/piezas",
        }
      - {
          label: "Foto después",
          name: "fotoDespues",
          widget: "image",
          required: false,
          media_folder: "/public/uploads/piezas",
          public_folder: "/uploads/piezas",
        }
      - {
          label: "Fotos adicionales",
          name: "fotos",
          widget: "list",
          required: false,
          field:
            {
              label: "Foto",
              name: "foto",
              widget: "image",
              media_folder: "/public/uploads/piezas",
              public_folder: "/uploads/piezas",
            },
        }
      - { label: "Materiales", name: "materiales", widget: "string", required: false }
      - {
          label: "Estado",
          name: "estado",
          widget: "select",
          default: "disponible",
          options:
            [
              { label: "Disponible", value: "disponible" },
              { label: "Vendido", value: "vendido" },
              { label: "A pedido", value: "a-pedido" },
              { label: "En proceso", value: "proceso" },
            ],
        }
      - { label: "Fecha", name: "fecha", widget: "datetime", default: "{{now}}" }
      - { label: "Historia", name: "body", widget: "markdown", required: false }
