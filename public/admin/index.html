<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flipping de muebles — Admin</title>
  </head>
  <body>
    <div id="nc-root"></div>
    <!--
      Decap CMS bootstrap. Pinned to an exact version rather than floating
      on ^3.0.0 (which auto-resolves to whatever the latest 3.x is on
      unpkg): floating meant every editor session silently picked up
      upstream changes with no way to know what shipped. There's a known
      image-preview regression upstream (blob-URL/broken-thumbnail bug
      reported since 3.8.4, still present in 3.16.3 and in 3.16.0 —
      confirmed by testing both here against this repo's git-gateway/
      DecapBridge backend: https://github.com/decaporg/decap-cms/issues/7639).
      Pinned to 3.8.0, the version upstream confirms predates the bug.
      3.8.0 predates the git-gateway PKCE session-restore-on-reload fix
      that landed in 3.16.0 (needed for DecapBridge's email/password
      login) — so if logging in or staying logged in across a page reload
      breaks, that's why; revert this pin to 3.16.0 (still broken image
      preview, but login works) or investigate further before going back
      to floating on latest.
      The script tag must come after #nc-root, at the end of body: with it
      in <head> (the pattern shown in older Decap/Netlify CMS examples),
      decap-cms.js throws "Cannot read properties of null (reading
      'appendChild')" on init because it tries to mount before <body>
      exists yet. Confirmed by testing directly against unpkg with both
      the pinned 3.10.0 and the 3.16.3 release — reproducible every time
      with the script in <head>, gone every time with it here.
    -->
    <script src="https://unpkg.com/decap-cms@3.8.0/dist/decap-cms.js"></script>
  </body>
</html>
