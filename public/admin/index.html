<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flipping de muebles — Admin</title>
  </head>
  <body>
    <div id="nc-root"></div>
    <!--
      Decap CMS bootstrap. Pinned to an exact version rather than floating
      on ^3.0.0 (which auto-resolves to whatever the latest 3.x is on
      unpkg): floating meant every editor session silently picked up
      upstream changes with no way to know what shipped.

      DO NOT drop below 3.16.0. Tried 3.8.0 to work around a known
      upstream image-preview bug (blob-URL/broken-thumbnail, reported
      since 3.8.4, still present as of 3.16.3:
      https://github.com/decaporg/decap-cms/issues/7639) — 3.8.0 also
      broke the Google login option in DecapBridge's auth screen, so it
      was reverted back to 3.16.0 the same day. The image-preview bug is
      still unresolved on 3.16.0 (a freshly-picked, not-yet-published
      image shows broken instead of a local/blob preview) — that's a
      known trade-off, not a regression from this pin. If revisiting this,
      re-verify BOTH the Google login button and the image preview before
      changing the version, and confirm with the site owner before
      testing anything below 3.16.0 given how easily this breaks login.
      The script tag must come after #nc-root, at the end of body: with it
      in <head> (the pattern shown in older Decap/Netlify CMS examples),
      decap-cms.js throws "Cannot read properties of null (reading
      'appendChild')" on init because it tries to mount before <body>
      exists yet. Confirmed by testing directly against unpkg with both
      the pinned 3.10.0 and the 3.16.3 release — reproducible every time
      with the script in <head>, gone every time with it here.
    -->
    <script src="https://unpkg.com/decap-cms@3.16.0/dist/decap-cms.js"></script>
    <script>
      // After publishing a pieza (new or edited), jump straight to a blank
      // "new entry" form instead of leaving the just-saved entry open — the
      // site owner loads several pieces in a row and wants each one to
      // start from an empty form, not the previous entry's data.
      CMS.registerEventListener({
        name: "postSave",
        handler: () => {
          window.location.hash = "#/collections/piezas/new";
        },
      });
    </script>
  </body>
</html>
